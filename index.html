<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 was here to stop iOS zooming on input focus. It also
         stopped anyone pinch-zooming the page at all, which for an app that
         renders Nastaliq and Arabic at small sizes is a real accessibility
         failure, not a theoretical one — and Lighthouse flags it. The input-zoom
         problem is solved properly in CSS instead: inputs are 16px, which is the
         threshold iOS uses to decide whether to zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1f" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Zaban — Learn the languages the world forgets</title>
    <meta name="description" content="Zaban is a free app for learning heritage and niche languages — Urdu, Punjabi, Bengali, Arabic, Nigerian Pidgin, and more. Real native audio, real conversations, built to help you reconnect with your roots." />
    <!-- Social sharing (TikTok bio, link previews) -->
    <meta property="og:title" content="Zaban — reconnect with your language" />
    <meta property="og:description" content="A free app for the heritage languages most apps ignore. Real audio, real conversations, 12 languages." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zaban — reconnect with your language" />
    <meta name="twitter:description" content="A free app for the heritage languages most apps ignore. 12 languages, real audio." />
    <!-- v77: fonts are served from this origin, not fonts.googleapis.com.
         The CDN version sent every visitor's IP to Google before a single line
         of the app had run — no consent, no way to decline, and a German court
         has awarded damages over precisely that (LG München I, 3 O 17493/20).
         Regenerate with `node scripts/fetch-fonts.mjs`.

         v78: the @font-face rules are bundled into the app's own stylesheet
         rather than linked separately — a second render-blocking request cost
         ~900ms on a throttled connection. The two faces used above the fold are
         preloaded so they start downloading alongside the CSS instead of after
         it, which is what removes the flash of fallback text. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/Nunito-400-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/Fraunces-700-latin.woff2" />

    <!-- Installable on a phone home screen without an app store. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zaban" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
