<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0a0f1f" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Zaban — Learn the languages the world forgets</title>
    <meta name="description" content="Zaban is a free app for learning heritage and niche languages — Urdu, Punjabi, Bengali, Arabic, Nigerian Pidgin, and more. Real native audio, real conversations, built to help you reconnect with your roots." />
    <!-- Social sharing (TikTok bio, link previews) -->
    <meta property="og:title" content="Zaban — reconnect with your language" />
    <meta property="og:description" content="A free app for the heritage languages most apps ignore. Real audio, real conversations, 12 languages." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zaban — reconnect with your language" />
    <meta name="twitter:description" content="A free app for the heritage languages most apps ignore. 12 languages, real audio." />
    <!-- v77: fonts are served from this origin, not fonts.googleapis.com.
         The CDN version sent every visitor's IP to Google before a single line
         of the app had run — no consent, no way to decline, and a German court
         has awarded damages over precisely that (LG München I, 3 O 17493/20).
         Regenerate with `node scripts/fetch-fonts.mjs`. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Installable on a phone home screen without an app store. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zaban" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
